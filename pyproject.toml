[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mini"
version = "0.1.0"
description = "A small but complete, interview-friendly RAG implementation"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
rag-mini = "ragmini.cli:main"

[tool.setuptools.packages.find]
include = ["ragmini*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
